<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragadees</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#9333ea);
        }

        .card{
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            font-size:80px;
            color:#4f46e5;
            letter-spacing:5px;
        }

        p{
            margin-top:15px;
            font-size:20px;
            color:#555;
        }

        button{
            margin-top:25px;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#4f46e5;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#372fcf;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>PRAGADEES</h1>
        <p>Welcome to my simple website</p>
        <button>Explore</button>
    </div>

</body>
</html>
